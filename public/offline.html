<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#020617">
  <meta name="color-scheme" content="dark light">
  <title>Offline | Nuxt PWA Studio</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #020617;
      color: #f8fafc;
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at top right, rgba(16, 185, 129, .2), transparent 35%),
        radial-gradient(circle at bottom left, rgba(14, 165, 233, .16), transparent 32%),
        #020617;
    }

    main {
      width: min(100%, 520px);
      padding: 36px;
      border: 1px solid rgba(148, 163, 184, .2);
      border-radius: 28px;
      background: rgba(15, 23, 42, .88);
      box-shadow: 0 28px 80px rgba(0, 0, 0, .36);
      backdrop-filter: blur(18px);
    }

    .icon {
      display: grid;
      place-items: center;
      width: 56px;
      height: 56px;
      border-radius: 18px;
      background: rgba(245, 158, 11, .14);
      color: #fbbf24;
    }

    h1 {
      margin: 26px 0 0;
      font-size: clamp(2rem, 8vw, 3rem);
      line-height: 1;
      letter-spacing: -.04em;
    }

    p {
      margin: 18px 0 0;
      color: #cbd5e1;
      line-height: 1.75;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 24px;
      padding: 12px 14px;
      border-radius: 14px;
      background: rgba(30, 41, 59, .8);
      color: #cbd5e1;
      font-size: .875rem;
      font-weight: 600;
    }

    .dot {
      width: 9px;
      height: 9px;
      border-radius: 999px;
      background: #f59e0b;
    }

    button {
      width: 100%;
      margin-top: 22px;
      border: 0;
      border-radius: 14px;
      padding: 13px 18px;
      background: #f8fafc;
      color: #020617;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      transition: transform 160ms ease, background 160ms ease;
    }

    button:hover { transform: translateY(-1px); background: #6ee7b7; }
    button:focus-visible { outline: 3px solid #34d399; outline-offset: 3px; }

    small {
      display: block;
      margin-top: 18px;
      color: #64748b;
      line-height: 1.6;
    }

    @media (prefers-reduced-motion: reduce) {
      button { transition: none; }
    }
  </style>
</head>
<body>
  <main>
    <div class="icon" aria-hidden="true">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M4 14.5A5.5 5.5 0 0 1 9.5 9c.72 0 1.41.14 2.04.39A4.5 4.5 0 1 1 17.5 18H8a4 4 0 0 1-4-3.5Z" stroke-linecap="round" stroke-linejoin="round" />
        <path d="m8 8 8 8" stroke-linecap="round" />
      </svg>
    </div>
    <h1>You are offline.</h1>
    <p>This page has not been cached yet. Previously visited areas of the app may still be available while your connection recovers.</p>
    <div class="status" role="status" aria-live="polite">
      <span class="dot" id="connection-dot" aria-hidden="true"></span>
      <span id="connection-status">Waiting for a connection</span>
    </div>
    <button type="button" onclick="window.location.reload()">Try again</button>
    <small>Nuxt PWA Studio will refresh automatically when the browser reports that you are back online.</small>
  </main>

  <script>
    const status = document.getElementById('connection-status')
    const dot = document.getElementById('connection-dot')

    const showOnline = () => {
      status.textContent = 'Connection restored. Reloading…'
      dot.style.background = '#10b981'
      window.setTimeout(() => window.location.reload(), 500)
    }

    if (navigator.onLine) showOnline()
    window.addEventListener('online', showOnline)
  </script>
</body>
</html>
